name: Deploy redirect to new home

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Build static redirect page
        run: |
          mkdir -p dist
          cat > dist/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="ro">
          <head>
            <meta charset="utf-8">
            <title>Radu Coaching — Platforma s-a mutat</title>
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <meta http-equiv="refresh" content="0; url=https://radumocutacoachingplatform.github.io/home/">
            <link rel="canonical" href="https://radumocutacoachingplatform.github.io/home/">
            <script>
              (function () {
                var target = 'https://radumocutacoachingplatform.github.io/home/';
                var rest = location.pathname.replace(/^\/radu-coaching-platform\/?/, '');
                if (rest) target += rest;
                target += location.search + location.hash;
                location.replace(target);
              })();
            </script>
            <style>
              body { background:#0a0a0a; color:#fff; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; display:grid; place-items:center; min-height:100vh; margin:0; text-align:center; padding:24px; }
              a { color:#ef4444; text-decoration:none; font-weight:600; }
              a:hover { text-decoration:underline; }
              h1 { margin:0 0 12px; font-size: clamp(24px, 4vw, 36px); }
              p { margin: 8px 0; color:#bbb; }
            </style>
          </head>
          <body>
            <div>
              <h1>Platforma s-a mutat</h1>
              <p>Noua adresa: <a href="https://radumocutacoachingplatform.github.io/home/">radumocutacoachingplatform.github.io/home</a></p>
              <p>Te redirectionam automat...</p>
            </div>
          </body>
          </html>
          HTML
          cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
